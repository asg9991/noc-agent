[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noc-agent"
version = "0.1.0"
description = "NOC Agent orchestrator skeleton (Zabbix read-only CLI + L0/L1/L2 router)"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent"]
